name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: time_reports
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d time_reports"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-never-use-for-production-9283741928374192837
      DATABASE_URL: postgresql://app:ci-only-password@localhost:5432/time_reports
      DEBUG: '1'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
      - run: docker build -t time-reports .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: artifacts/qa/
