[project]
name = "project-time-reports"
version = "0.1.0"
description = "Výkazy práce, projektové náklady a plánovaná nepřítomnost"
requires-python = ">=3.13,<3.14"
dependencies = ["django>=5.2.18,<5.3", "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24", "whitenoise>=6.9,<7", "openpyxl>=3.1.5,<4", "django-axes>=8,<9", "dj-database-url>=3,<4", "defusedxml>=0.7,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "pytest-playwright>=0.7,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: browser journey requiring running server"]
[tool.ruff]
line-length = 100
extend-exclude = [".runtime", "staticfiles"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
